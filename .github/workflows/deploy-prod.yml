name: Deploy Lambdas — Prod

on:
  push:
    tags:
      - "release/*"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'deploy-prod' to confirm production deployment"
        required: true

env:
  AWS_REGION: ap-south-1
  ENV: prod

jobs:
  guard:
    name: Confirm production deployment
    runs-on: ubuntu-latest
    steps:
      - name: Check manual confirmation
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy-prod" ]; then
            echo "❌ Production deployment not confirmed. Input must be 'deploy-prod'."
            exit 1
          fi
          echo "✅ Production deployment confirmed."

  deploy-prod:
    name: Build & Deploy to Prod
    runs-on: ubuntu-latest
    needs: guard
    environment: prod

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Build Lambda packages
        run: bash scripts/build.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.0"

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -reconfigure

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Deploy Lambda resources
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var-file=environments/prod.tfvars \
            -target=aws_lambda_function.data_sync \
            -target=aws_lambda_function.data_process \
            -target=aws_cloudwatch_event_target.data_sync_lambda \
            -target=aws_lambda_permission.allow_eventbridge_data_sync \
            -target=aws_lambda_event_source_mapping.sqs_to_data_process \
            -target=aws_lambda_permission.allow_sqs_data_process

      - name: Show deployment outputs
        working-directory: terraform
        run: |
          terraform output data_sync_function_name
          terraform output data_process_function_name
